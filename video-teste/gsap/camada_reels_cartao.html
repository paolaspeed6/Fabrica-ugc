<!doctype html>
<html><head><meta charset="utf-8">
<!-- Reels modelo 4 "cartão" (aprovado por a dona em 2026-10-15): cartão escuro embaixo com rótulo na cor,
     título grande com destaque, botão de CTA cheio e selo redondo (ex.: "200 TAPETES"). -->
<style>
@font-face{font-family:M;src:url("../fontes/Montserrat.ttf");font-weight:100 900}
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
body{font-family:M,sans-serif;color:#fff;position:relative}
.card{position:absolute;left:50px;right:50px;bottom:300px;border-radius:44px;background:rgba(14,14,16,.84);padding:46px 50px 50px;
  box-shadow:0 20px 50px rgba(0,0,0,.35)}
.rot{font:700 38px M;letter-spacing:4px;text-transform:uppercase}
.t{font:800 96px/1.04 M;margin-top:14px;letter-spacing:-1px}
.t em{font-style:normal}
.sub{font:600 46px/1.25 M;margin-top:18px;color:#e8e8e8}
.cta{margin-top:34px;height:120px;border-radius:30px;color:#161616;font:800 50px/120px M;text-align:center;position:relative;overflow:hidden}
.cta .br{position:absolute;top:0;bottom:0;width:160px;left:-220px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg)}
.selo{position:absolute;right:30px;top:-120px;width:210px;height:210px;border-radius:50%;background:#fff;color:#161616;
  display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.selo b{font:900 84px/0.9 M} .selo i{font:800 17px M;font-style:normal;letter-spacing:0;text-transform:uppercase;white-space:nowrap;margin-top:4px}
</style></head><body>
<script src="gsap.min.js"></script>
<script src="comum.js"></script>
<script>
const D = window.DADOS, cor = "#" + D.cor;
const tl = gsap.timeline({paused: true});
document.fonts.load("800 96px M").then(() => {
  D.cenas.forEach((c, i) => {
    const card = el("div", "card"); gsap.set(card, {autoAlpha: 0});
    const t0 = c.ini + 0.2;
    tl.set(card, {autoAlpha: 1}, c.ini).from(card, {y: 80, duration: .45, ease: "power3.out"}, c.ini);
    const partes = [];
    if (c.rotulo) { const r = el("div", "rot", card, c.rotulo); r.style.color = cor;
      if (c.selo || D.selo) r.style.paddingRight = "200px";  // não passa por baixo do selo
      partes.push(r); }
    const t = el("div", "t", card); destaque(t, c.titulo || "");
    t.querySelectorAll("em").forEach(e => e.style.color = cor);
    partes.push(t);
    if (c.sub) partes.push(el("div", "sub", card, c.sub));
    tl.from(partes, {y: 30, autoAlpha: 0, duration: .4, ease: "power3.out", stagger: .1}, t0);
    if (c.cta) {
      const b = el("div", "cta", card); b.style.background = cor;
      const br = el("div", "br", b); b.appendChild(document.createTextNode(c.cta + " 👇"));
      tl.from(b, {scale: .8, autoAlpha: 0, duration: .4, ease: "back.out(1.8)"}, t0 + .45);
      for (let k = t0 + 1.1; k < c.fim - .5; k += 1.3) tl.fromTo(br, {x: 0}, {x: 1300, duration: .7, ease: "power2.inOut"}, k);
    }
    const selo = c.selo || D.selo;
    if (selo) {
      const s = el("div", "selo", card); el("b", null, s, selo.n); el("i", null, s, selo.t);
      tl.from(s, {scale: 0, rotate: -40, duration: .5, ease: "back.out(2)"}, t0 + .3)
        .to(s, {rotate: 8, duration: .3, ease: "power1.out"}, t0 + .8);
    }
    if (i < D.cenas.length - 1) tl.to(card, {autoAlpha: 0, y: 40, duration: .25, ease: "power2.in"}, c.fim - .3);
  });
  tl.set({}, {}, D.fim);
  window.TL = tl;
});
</script></body></html>

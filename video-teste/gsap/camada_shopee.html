<!doctype html>
<html><head><meta charset="utf-8">
<!-- Camada de texto animada (estilo Shopee) renderizada quadro a quadro por render.js.
     Fundo transparente; o cartão de vidro fosco continua sendo feito pelo ffmpeg na mesma área. -->
<style>
@font-face{font-family:M;src:url("../fontes/Montserrat.ttf");font-weight:100 900}
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
body{font-family:M,sans-serif;color:#fff;position:relative}
.cena{position:absolute;left:60px;top:1300px;width:960px;height:340px}
.rot{position:absolute;left:50px;top:44px;height:50px;border-radius:25px;padding:0 22px;
  font:700 28px/50px M;letter-spacing:3px;color:#181818;transform-origin:left center}
.dots{position:absolute;right:34px;top:64px;display:flex;gap:10px}
.dot{height:10px;width:10px;border-radius:5px;background:rgba(255,255,255,.43);overflow:hidden;position:relative}
.dot.on{width:56px}
.dot i{position:absolute;inset:0;transform-origin:left;transform:scaleX(0)}
.tit{position:absolute;left:50px;top:122px;width:860px;font:800 66px/80px M}
.l{display:block;overflow:hidden;padding-bottom:6px;margin-bottom:-6px}
.w{display:inline-block;position:relative;white-space:pre}
.w.d{color:#fff;padding:0 10px;margin:0 -2px}
.w.d b{position:absolute;inset:6px 0 4px;border-radius:12px;z-index:-1;transform-origin:left;transform:scaleX(0)}
.w.d span{position:relative}
.fichas{position:absolute;left:50px;display:flex;gap:14px}
.f{height:58px;border:2px solid rgba(255,255,255,.8);border-radius:29px;padding:0 24px;font:600 32px/56px M;box-sizing:border-box}
.cta{position:absolute;left:60px;top:1666px;width:960px;height:104px;border-radius:30px;overflow:hidden;
  font:800 44px/104px M;color:#141414;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.35)}
.cta .brilho{position:absolute;top:0;bottom:0;width:180px;left:-240px;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg)}
.cta .seta{display:inline-block;margin-left:18px}
.abre{position:absolute;left:60px;top:1250px;width:960px;height:420px;text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.abre .n{font:900 250px/0.9 M;letter-spacing:-6px;text-shadow:0 10px 40px rgba(0,0,0,.55)}
.abre .t{font:800 70px/1.05 M;color:#fff;text-shadow:0 6px 24px rgba(0,0,0,.7)}
.abre .t span{display:inline-block}
</style></head><body>
<script src="gsap.min.js"></script>
<script>
// DADOS = {cor, cenas:[{rotulo,titulo,fichas,cta,ini,fim}], total}
const D = window.DADOS, cor = "#" + D.cor;
const tl = gsap.timeline({paused: true});
document.fonts.load("800 66px M").then(() => {
function el(tag, cls, pai, txt){const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; (pai||document.body).appendChild(e); return e}
// quebra o título em linhas de até 860px, com [destaques]
const medidor = el("div","tit"); medidor.style.visibility="hidden";
function linhas(titulo){
  const toks=[]; titulo.replace(/\[([^\]]+)\]|(\S+)/g,(m,a,b)=>{(a||b).split(" ").forEach(p=>toks.push({t:p,d:!!a}))});
  const out=[[]]; medidor.innerHTML=""; const s=el("span",null,medidor);
  for(const k of toks){const linha=out[out.length-1]; s.textContent=[...linha,k].map(x=>x.t).join(" ");
    if(s.getBoundingClientRect().width>(toks.some(x=>x.d)?790:840) && linha.length) out.push([k]); else linha.push(k)}
  return out;
}
D.cenas.forEach((c, i) => {
  const box = el("div","cena"); gsap.set(box,{autoAlpha:0});
  const ab = c.abertura, t0 = c.ini + 0.15 + (ab ? 1.9 : 0), dur = c.fim - c.ini;
  tl.set(box,{autoAlpha:1}, t0 - 0.15);
  // abertura: número gigante + frase entrando com impacto no 1º segundo, depois some para o cartão
  if (ab){const a=el("div","abre"); gsap.set(a,{autoAlpha:0});
    const n=el("div","n",a,ab.grande); n.style.color=cor;
    const t=el("div","t",a); const ps=ab.texto.split(" ").map(p=>{const x=el("span",null,t,p); t.appendChild(document.createTextNode(" ")); return x});
    tl.set(a,{autoAlpha:1}, c.ini)
      .from(n,{scale:3,autoAlpha:0,duration:.35,ease:"expo.out"}, c.ini+.05)
      .to(n,{x:"+=10",duration:.05,repeat:3,yoyo:true,ease:"none"}, c.ini+.4)
      .from(ps,{y:60,autoAlpha:0,scale:.6,duration:.3,ease:"back.out(2)",stagger:.07}, c.ini+.45)
      .to(n,{scale:1.06,duration:.5,yoyo:true,repeat:1,ease:"sine.inOut"}, c.ini+.9)
      .to(a,{scale:.55,y:60,autoAlpha:0,duration:.3,ease:"power3.in"}, c.ini+1.75)}
  // etiqueta
  if (c.rotulo){const r=el("div","rot",box,c.rotulo.toUpperCase()); r.style.background=cor;
    tl.from(r,{scaleX:0.2,autoAlpha:0,duration:.4,ease:"back.out(1.6)"}, t0)}
  // indicador de cena: a barra ativa enche durante a cena
  const dots=el("div","dots",box);
  for(let k=0;k<D.total;k++){const d=el("div","dot"+(k===i?" on":""),dots); if(k<i) d.style.background=cor;
    if(k===i){const f=el("i",null,d); f.style.background=cor; tl.to(f,{scaleX:1,duration:dur,ease:"none"}, c.ini)}}
  // título palavra por palavra, subindo de dentro da linha
  const tit=el("div","tit",box); const ws=[], marcas=[];
  linhas(c.titulo||"").forEach(ln=>{const L=el("span","l",tit); ln.forEach((k,j)=>{
    const w=el("span","w"+(k.d?" d":""),L); if(k.d){const b=el("b",null,w); b.style.background=cor; marcas.push(b); el("span",null,w,k.t)} else w.textContent=k.t;
    ws.push(w); if(j<ln.length-1) L.appendChild(document.createTextNode(" "))})});
  tl.from(ws,{yPercent:110,rotate:4,duration:.5,ease:"power3.out",stagger:.06}, t0+.15);
  if (marcas.length){const tm=t0+.15+ws.length*.06+.2; tl.to(marcas,{scaleX:1,duration:.35,ease:"power2.inOut",stagger:.08}, tm)
    .to(marcas.map(b=>b.parentNode),{color:"#181818",duration:.2,stagger:.08}, tm+.15)}
  // fichas
  if (c.fichas){const fs=el("div","fichas",box); fs.style.top=(122+tit.offsetHeight+14)+"px";  // altura real do título (se quebrar sozinho, as fichas descem)
    const fe=c.fichas.map(x=>el("div","f",fs,x));
    tl.from(fe,{y:24,scale:.85,autoAlpha:0,duration:.35,ease:"back.out(1.7)",stagger:.07}, t0+.9)}
  // saída da cena
  if (i < D.cenas.length-1) tl.to(box,{autoAlpha:0,y:-30,duration:.25,ease:"power2.in"}, c.fim-0.3);
  // CTA: entra com pop, brilho passa e a seta empurra
  if (c.cta){const b=el("div","cta"); b.style.background=cor; gsap.set(b,{autoAlpha:0});
    const br=el("div","brilho",b); b.appendChild(document.createTextNode(c.cta)); const s=el("span","seta",b,"→");
    tl.set(b,{autoAlpha:1}, t0+.55).from(b,{scale:.7,y:40,duration:.45,ease:"back.out(1.8)"}, t0+.55);
    for(let t=t0+1.1;t<c.fim-0.5;t+=1.3){tl.fromTo(br,{x:0},{x:1440,duration:.7,ease:"power2.inOut"}, t)
      .to(s,{x:12,duration:.18,yoyo:true,repeat:1,ease:"power1.inOut"}, t+.4)}}
});
tl.set({}, {}, D.fim);
window.TL = tl;
});
</script></body></html>

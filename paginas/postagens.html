<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Postagens</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap">
<style>
/* Layout: lista contínua para rolar; cada produto abre com um separador; cada vídeo é uma linha com os 4 passos em botões */
:root{
  --bg:#f6f5f2; --card:#ffffff; --fg:#1c1a19; --muted:#77706a; --line:#ebe7e1; --soft:#f1eee9;
  --accent:#ee4d2d; --accent-fg:#ffffff; --done:#14804a; --done-bg:#e3f5ea;
  --shadow:0 1px 2px rgba(28,26,25,.05),0 8px 24px -14px rgba(28,26,25,.25);
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141211; --card:#1e1b19; --fg:#f2eee9; --muted:#a59d95; --line:#2f2b28; --soft:#262220;
  --accent:#ff6a4a; --accent-fg:#1a0d09; --done:#5fd394; --done-bg:#173a27;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -16px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141211; --card:#1e1b19; --fg:#f2eee9; --muted:#a59d95; --line:#2f2b28; --soft:#262220;
  --accent:#ff6a4a; --accent-fg:#1a0d09; --done:#5fd394; --done-bg:#173a27;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -16px rgba(0,0,0,.7); color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:1.6rem;margin:0;letter-spacing:-.02em}
.topo{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.cont{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.barra{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--done);transition:width .3s var(--ease-out)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:4px;background:var(--soft);border-radius:12px;position:sticky;top:0;z-index:2}
.tab{border:0;background:transparent;color:var(--muted);border-radius:9px;padding:9px 4px;font:700 .8rem var(--body);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.lista{display:flex;flex-direction:column;gap:8px}
.rodizio{display:flex;flex-direction:column;gap:3px;background:var(--card);border:1.5px solid var(--accent);border-radius:14px;padding:12px 14px;margin:6px 0 4px;box-shadow:var(--shadow)}
.rodizio b{font:800 18px/1.2 var(--display);color:var(--accent)}.rodizio span{font-size:14px;color:var(--fg)}.rodizio small{font-size:13px;color:var(--muted)}
.sep{display:flex;align-items:center;gap:10px;margin:14px 2px 2px}
.sep:first-child{margin-top:4px}
.sep img{width:34px;height:34px;border-radius:9px;object-fit:cover;background:var(--line);flex:none}
.sep b{font:800 .98rem var(--display);line-height:1.25;letter-spacing:-.01em;min-width:0}
.sep span{display:block;font:600 .74rem var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sep::after{content:"";flex:1;height:1px;background:var(--line);min-width:16px}
.video{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:10px;display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start;transition:opacity .2s ease}
.video.feito{opacity:.55}
.video>img{width:64px;height:114px;object-fit:cover;border-radius:10px;background:var(--line)}
.info{min-width:0;display:flex;flex-direction:column;gap:8px}
.topo-v{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.placar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 6px}
.num{background:var(--card);border-radius:14px;padding:12px 8px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.num b{display:block;font:800 1.6rem var(--display,var(--body));font-variant-numeric:tabular-nums}
.num span{font:700 .74rem var(--body);color:var(--muted)}
.topo-v .b,.topo-v .leve{flex:none;padding:7px 10px;font-size:.76rem}
.topo-v .tit{flex:1}
.acoes{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.b.postei{grid-column:1/-1}
.b.pedir{background:var(--card);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--line)}
.b.lixo{background:var(--card);color:#d6453d;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,#d6453d 45%,transparent)}
.pedido[hidden]{display:none}
.pedido{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;background:var(--soft);border-radius:10px;padding:8px}
.pedido textarea{width:100%;min-height:64px;border:1.5px solid var(--line);border-radius:8px;padding:8px;font:600 .9rem var(--body);background:var(--card);color:var(--fg);box-sizing:border-box}
.pedido .linha2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.estado-ed{font-size:.78rem;font-weight:700;color:var(--muted);margin-top:2px}
.tit{font-weight:700;font-size:.92rem}
.tit small{display:block;color:var(--muted);font-weight:600;font-size:.78rem;margin-top:1px}
.botoes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.b{display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--soft);color:var(--fg);border-radius:10px;padding:9px 6px;font:700 .8rem var(--body);text-decoration:none;cursor:pointer;
  transition:transform .14s var(--ease-out),background .16s ease}
.b:active{transform:scale(.97)}
.b.ok{background:var(--done-bg);color:var(--done)}
.b.postei{background:var(--accent);color:var(--accent-fg)}
.b:disabled{opacity:.5}
.legenda{grid-column:1/-1;white-space:pre-wrap;font-size:.82rem;color:var(--muted);background:var(--soft);border-radius:10px;padding:10px;user-select:all}
.item{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:10px;display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center}
.item img{width:44px;height:44px;object-fit:cover;border-radius:8px;background:var(--line)}
.item .t{min-width:0;font-size:.88rem;font-weight:600;line-height:1.3}
.item .t span{display:block;color:var(--muted);font-size:.76rem}
.estado{font:700 .74rem var(--body);padding:4px 8px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.estado.ok{background:var(--done-bg);color:var(--done)}
.redes{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.redes a{font:700 .74rem var(--body);color:var(--accent);text-decoration:none}
.leve{border:0;background:var(--soft);color:var(--fg);border-radius:10px;padding:8px 12px;font:700 .82rem var(--body);cursor:pointer}
.vazio{color:var(--muted);font-weight:600;text-align:center;padding:28px 10px;border:2px dashed var(--line);border-radius:14px;line-height:1.5}
.conf{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:10px;display:grid;grid-template-columns:64px 1fr;gap:12px}
.conf>img{width:64px;height:114px;object-fit:cover;border-radius:10px;background:var(--line)}
.conf textarea{grid-column:1/-1;width:100%;box-sizing:border-box;min-height:64px;border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit;font-size:.85rem;background:var(--soft);color:var(--fg)}
.b.editar{background:var(--soft);color:var(--fg)}
.nota{font-size:.8rem;color:var(--muted)}
.aviso{font-size:.8rem;font-weight:600;color:var(--accent)}
.cenas{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cena{display:flex;flex-direction:column;gap:4px;font-size:.74rem;color:var(--muted)}
.cena img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:10px;background:var(--line);border:3px solid transparent}
.cena.sel img{border-color:var(--done)}
.cena button,.cena a{font:700 .74rem var(--body)}
.busca{position:relative;display:flex;align-items:center}
.busca svg{position:absolute;left:12px;width:18px;height:18px;color:var(--muted);pointer-events:none}
.busca input{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:11px 38px 11px 40px;font:600 16px var(--body)}
.busca input::-webkit-search-cancel-button{display:none;-webkit-appearance:none}
.busca input:focus{outline:2px solid var(--accent);outline-offset:1px}
.busca button{position:absolute;right:6px;border:0;background:transparent;color:var(--muted);font:700 1.1rem var(--body);padding:6px 8px;cursor:pointer}
.tab{line-height:1.15}
@media (max-width:420px){.tab{font-size:.72rem;padding:8px 2px}}
.conf>video{width:64px;height:114px;object-fit:cover;border-radius:10px;background:var(--line)}
.tts-form{grid-template-columns:1fr;gap:8px}
.tts-form input[type=url],.tts-form input[type=text]{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:10px;font:600 16px var(--body);background:var(--soft);color:var(--fg)}
.tts-form textarea{font-size:16px}
.vids{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vids:empty{display:none}
.vid{position:relative;display:flex;flex-direction:column;gap:4px;font:700 .74rem var(--body);color:var(--done)}
.vid video,.vid img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:10px;background:var(--line);border:2px solid var(--done)}
.vid .foto{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.6);color:#fff;border-radius:99px;padding:2px 7px;font:700 .7rem var(--body)}
.vid.grande{color:var(--accent)} .vid.grande video{border-color:var(--accent)}
.vid .tirar{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font:700 18px/28px var(--body);padding:0;cursor:pointer}
.vid.mais{align-items:center;justify-content:center;aspect-ratio:9/16;border:2px dashed var(--line);border-radius:10px;background:transparent;color:var(--muted);cursor:pointer}
.ganchos{border:1.5px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:10px}
.ganchos summary{font:700 .9rem var(--body);cursor:pointer}
.gsel{display:flex;flex-direction:column;gap:5px;font:700 .8rem var(--body);color:var(--muted)}
.gsel select,.gsel input{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:10px;font:600 16px var(--body);background:var(--soft);color:var(--fg)}
.b.escolher{min-height:54px;font-size:.95rem;border:2px dashed var(--accent);background:transparent;color:var(--accent)}
.slot{display:flex;align-items:center;justify-content:center;text-align:center;min-height:64px;padding:8px 4px;border:2px dashed var(--line);border-radius:12px;font:700 .78rem var(--body);color:var(--muted);cursor:pointer}
.slot.ok{border-style:solid;border-color:var(--done);background:var(--done-bg);color:var(--done)}
.slot.grande{border-color:var(--accent);background:transparent;color:var(--accent)}
.criativos{grid-column:1/-1;display:flex;flex-direction:column;gap:8px}
.criativo{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:start;background:var(--soft);border-radius:12px;padding:8px}
.criativo.feito{opacity:.6}
.criativo>img{width:56px;height:100px;object-fit:cover;border-radius:8px;background:var(--line)}
.criativo .b{background:var(--card)}
.criativo .b.ok{background:var(--done-bg)}
.criativo .b.postei{background:var(--accent)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.b,.barra i,.video{transition:none}}
</style>

<div class="wrap">
  <div class="topo"><h1 id="h1">Postagens</h1><span class="cont" id="cont"></span><a class="leve" id="troca" href="conferencia.html"></a></div>
  <div class="barra" aria-hidden="true"><i id="prog" style="width:0%"></i></div>
  <div class="tabs" role="group" aria-label="Abas">
    <button class="tab" id="t-conf" aria-pressed="false">Conferir</button>
    <button class="tab" id="t-fazer" aria-pressed="true">Para postar</button>
    <button class="tab" id="t-reels" aria-pressed="false">Reels auto</button>
    <button class="tab" id="t-feitos" aria-pressed="false">Postados</button>
    <button class="tab" id="t-esg" aria-pressed="false">Esgotados</button>
    <button class="tab" id="t-tts" aria-pressed="false">TikTok Shop</button>
  </div>
  <label class="busca" id="busca-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
    <input id="busca" type="search" placeholder="Procurar produto" aria-label="Procurar produto" autocomplete="off"><button id="limpa" type="button" aria-label="Limpar busca" hidden>×</button></label>
  <main id="tela"><div class="vazio">Carregando os vídeos…</div></main>
</div>

<script>
// a dona 27/10: Conferência e Postagens são páginas separadas no MESMO endereço (mesmo banco): o Ok na Conferência já cai em Postagens
const MODO=/conferencia/.test(location.pathname)?"conf":"post";
const otim={}; // mudanças feitas na tela antes do banco confirmar
let db=null, posts=[], esgotados=[], conferir=[], aba=MODO==="conf"?"conf":"fazer", feito={}, escolheu=false;
if(MODO==="conf"){ document.title="Conferência"; }
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t); if(c) e.className=c; if(x!=null) e.textContent=x; return e;};
// a dona 27/10: dois lotes no mesmo dia (2710A e 2710B) se misturavam e cada produto aparecia com 1 vídeo só
const loteDe=p=>(p._id||"").split(/[_-]/)[0];
// a dona 02/11: o que entra por último em "Para postar" vai para o FIM da lista (hora do Ok; sem ela, a data do lote)
const entrou=p=>p.liberado_em||p.dia||"";
// a dona 27/11: "deixe os produtos que fiz por primeiro": ordem do lote (dia em que o vídeo foi feito), depois a hora do Ok
const porFeito=(a,b)=>(a.dia||"").localeCompare(b.dia||"")||loteDe(a).localeCompare(loteDe(b))||entrou(a).localeCompare(entrou(b))||(a.ordem||0)-(b.ordem||0);
const porEntrada=(a,b)=>entrou(a).localeCompare(entrou(b))||(a.dia||"").localeCompare(b.dia||"")||loteDe(a).localeCompare(loteDe(b))||(a.ordem||0)-(b.ordem||0);
// a dona 02/11: lupa para achar um produto (sem acento, sem maiúscula)
const semAc=t=>(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
let busca="";
const acha=p=>!busca||semAc([p.produto,p.legenda,p.versao,p._id].join(" ")).includes(busca);
const dataBR=d=>d?d.slice(0,10).split("-").reverse().join("/"):"";
const hoje=()=>new Date().toISOString().slice(0,10);
const NOMES={A:"Um dia com ela",B:"Faixas",C:"Direto ao ponto"};
function rodizio(){ // dia local; ciclo de 6 dias a partir de 15/11/2026 (A)
  const d=new Date(), t0=Date.UTC(2026,10,15), t=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());
  const n=Math.floor((t-t0)/864e5), k=((Math.floor(n/2)%3)+3)%3, L="ABC", ini=n-(((n%2)+2)%2);
  const br=x=>{const z=new Date(t0+x*864e5); return String(z.getUTCDate()).padStart(2,"0")+"/"+String(z.getUTCMonth()+1).padStart(2,"0");};
  return {hoje:L[k], ultimo:n!==ini, prox:[[L[(k+1)%3],br(ini+2)],[L[(k+2)%3],br(ini+4)]]};
}
const mais30=()=>new Date(Date.now()+30*864e5).toISOString().slice(0,10);
// Esgotado (Kevin 23/10): o produto sai da fila com todos os vídeos e vai para conferência mensal
async function marcarEsgotado(p){
  const vs=posts.filter(x=>(x.dia||"")===(p.dia||"")&&x.produto===p.produto&&x.status!=="postado");
  const id=((p.dia||"")+"-"+p.produto).normalize("NFD").replace(/[^\w-]+/g,"_").slice(0,80);
  const urls={}; vs.forEach(x=>{ if(x.versao) urls[x.versao]=x.drive_url; });
  await db.doc("esgotados/"+id).set({produto:p.produto,lote:p.dia||"",link_produto:p.link_produto||"",poster:p.poster||"",
    drive_urls:urls,posts:vs.map(({_id,...x})=>({...x,_id})),marcado_em:new Date().toISOString(),conferir_em:mais30()});
  for(const x of vs) await db.doc("posts/"+x._id).delete();
}
async function voltouEstoque(e){
  const vs=e.posts&&e.posts.length? e.posts : Object.entries(e.drive_urls||{}).map(([v,u],i)=>({_id:e._id+"-"+v,versao:v,drive_url:u,ordem:i,auto:/reels/i.test(v)}));
  for(const {_id,...x} of vs) await db.doc("posts/"+_id).set({produto:e.produto,dia:e.lote,link_produto:e.link_produto,poster:e.poster,...x,status:"pronto",liberado_em:new Date().toISOString()});
  await db.doc("esgotados/"+e._id).delete();
}
// Conferência dentro da Postagens (a dona, 27/10): Ok libera os vídeos do produto em "Para postar" na hora, sem o Claude
async function aprovar(c){
  for(const [id,x] of Object.entries(c.posts||{})) await db.doc("posts/"+id).set({...x,poster:x.poster||c.poster||"",status:"pronto",liberado_em:new Date().toISOString()});
  await db.doc("conferir/"+c._id).update({status:"ok",decidido_em:new Date().toISOString()});
}
// Resgate (a dona 27/10): produto sem cena aprovada; ela olha as cenas reprovadas antes de perder as 3 gerações
// motivo de cada cena reprovada (a dona 27/10: "me traga junto com o motivo")
function listaReprov(c){
  const r=c.reprovadas||[]; const box=el("details","nota");
  box.append(el("summary",null,r.length?`${r.length} reprovação(ões) de cena — ver motivos`:"Nenhuma cena reprovada"));
  r.forEach(x=>box.append(el("div",null,`Cena ${x.cena} · ${x.etapa}: ${x.motivo}`))); return box;
}
function cardResgate(c){
  const v=el("article","conf"); const im=el("img"); if(c.poster) im.src=c.poster; im.alt=""; v.append(im);
  const info=el("div","info"); const t=el("div","tit",c.produto); t.append(el("small",null,`${c.lote||""} · nenhuma cena passou na fiscal`)); info.append(t);
  info.append(el("div","aviso","Antes de descartar: veja as cenas reprovadas. Se alguma servir, marque e toque em Usar."));
  if(c.link_anuncio){ const a=el("a","b","Anúncio"); a.href=c.link_anuncio; a.target="_blank"; a.rel="noopener"; info.append(a); }
  info.append(listaReprov(c));
  v.append(info);
  if(c.status!=="pendente"){ v.append(el("div","nota",c.status==="resgatar"?"O Claude vai montar os vídeos com: "+(c.escolha||[]).join(", "):"Produto descartado.")); return v; }
  const sel=new Set(); const g=el("div","cenas");
  (c.cenas||[]).forEach(x=>{ const d=el("div","cena"); const ci=el("img"); ci.src=x.poster||""; ci.alt="Cena "+x.id;
    const marcar=el("button","leve","Marcar cena "+x.id); marcar.onclick=()=>{ sel.has(x.id)?sel.delete(x.id):sel.add(x.id); d.classList.toggle("sel",sel.has(x.id)); marcar.textContent=(sel.has(x.id)?"✓ ":"Marcar ")+"cena "+x.id; };
    d.append(ci,marcar); if(x.drive_url){ const a=el("a","b","Ver vídeo"); a.href=x.drive_url; a.target="_blank"; a.rel="noopener"; d.append(a); }
    d.append(el("span",null,(x.tipo==="imagem"?"(só imagem) ":"")+(x.motivo||""))); g.append(d); });
  const usar=el("button","b postei","Usar estas cenas"); const desc=el("button","b editar","Descartar produto");
  usar.onclick=async()=>{ if(!sel.size){ usar.textContent="Marque ao menos 1 cena"; return; } usar.disabled=true;
    try{ await db.doc("conferir/"+c._id).update({status:"resgatar",escolha:[...sel],decidido_em:new Date().toISOString()}); }catch(e){ usar.disabled=false; usar.textContent="Não salvou, toque de novo"; } };

async function apagarClipes(p,tudo){
  for(const x of p.clipes||[]) await assets.delete(x.id);

}

async function enviarDrive(c){
  const mcp=await (window.claude?.use?window.claude.use("mcp"):null);
  if(!mcp) throw {msg:"Abra no app do Claude"};
  const lt=await mcp.listTools().catch(()=>({}));
  if(!lt.fileArgs) throw {msg:"Atualize o app do Claude"};
  const r=await fetch(blob(c.video)); if(!r.ok) throw {msg:"Vídeo não carregou, toque de novo"};
  const dado=await r.blob(); const nome=(c.arquivo||"criativo")+".mp4";
  // nome do conector e da ferramenta como o app da dona lista (pode diferir do que o Claude vê)
  const sv=(lt.servers||[]).find(s=>/drive/i.test(s.server)); const srv=sv?sv.server:"Google Drive";
  const tl=sv&&(sv.tools||[]).find(t=>/create_file/i.test(t.name||t)); const tool=tl?(tl.name||tl):"create_file";
  // a dona 03/11: o app só aceita alguns tipos no $file (vídeo não). O tipo do $file só serve para a passagem;
  // o Drive grava como vídeo por contentMimeType + título .mp4. Tenta mp4 e, se recusar, um tipo da lista aceita.
  const EXT={"application/octet-stream":"bin","application/zip":"zip","application/pdf":"pdf","text/plain":"txt","application/json":"json","text/csv":"csv",
    "application/vnd.openxmlformats-officedocument.presentationml.presentation":"pptx","application/vnd.openxmlformats-officedocument.wordprocessingml.document":"docx",
    "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":"xlsx","image/png":"png","image/jpeg":"jpg"};
  const PREF=["application/octet-stream","application/zip","application/pdf","application/vnd.openxmlformats-officedocument.presentationml.presentation","application/vnd.openxmlformats-officedocument.wordprocessingml.document","application/vnd.openxmlformats-officedocument.spreadsheetml.sheet","text/plain","image/png","image/jpeg"];
  const chamar=(tipo,arq)=>mcp.callTool(srv,tool,{title:nome,parentId:PASTA_DRIVE,contentMimeType:"video/mp4",disableConversionToGoogleType:true,
    base64Content:{$file:{data:dado,name:arq,type:tipo}}});
  let res=null, ultimo=null, tipos=["video/mp4"], tentados=new Set();
  while(tipos.length&&!res){ const tipo=tipos.shift(); if(tentados.has(tipo)) continue; tentados.add(tipo);
    const arq=tipo==="video/mp4"?nome:(c.arquivo||"criativo")+"."+(EXT[tipo]||"bin");
    try{ res=await chamar(tipo,arq); }
    catch(e){ ultimo=e; const m=String(e&&e.message||"");
      if(e&&e.code==="bad_request"&&/must be one of/i.test(m)){
        const lista=(m.split(/one of:?/i)[1]||"").split(/[,\s]+/).map(s=>s.replace(/[.;]$/,"")).filter(s=>s.includes("/"));
        tipos=[...PREF.filter(t=>lista.includes(t)),...lista.filter(t=>!PREF.includes(t)&&EXT[t])].filter(t=>!tentados.has(t)); }
      else break; } }
  if(!res){ const e=ultimo||{}; const cd=e.code||"?";
    throw {msg:cd==="server_not_connected"?"Conecte o Google Drive no claude.ai":"Erro: "+cd+(e.message?" · "+String(e.message).slice(0,140):"")}; }
  const pl=res.payload||{}; let id=pl.id||(pl.file&&pl.file.id);
  if(!id){ const m=JSON.stringify(res).match(/"id"\s*:\s*"([\w-]{20,})"/); id=m&&m[1]; }
  if(!id) throw {msg:"Enviou, mas não achei o link"};
  return "https://drive.google.com/file/d/"+id+"/view";
}
function cardTTS(p){
  const v=el("article","conf"); v.append(miniatura(p));
  const info=el("div","info"); const st=p.status||"aguardando";
  const topo=el("div","topo-v"); const t=el("div","tit",p.produto||"Produto sem nome ainda");
  t.append(el("small",null,`${dataBR(p.criado_em)} · ${(p.clipes||[]).length||"sem"} clipe(s)${p.cor?" · "+p.cor:""}`));
  topo.append(t,el("span","estado"+(st==="pronto"?" ok":""),ESTADO[st]||st)); info.append(topo);
  const bs=el("div","botoes"); if(p.link){ const a=el("a","b","Abrir produto ↗"); a.href=p.link; a.target="_blank"; a.rel="noopener"; bs.append(a); }
  info.append(bs);
  if(p.obs) info.append(el("div","nota","Obs.: "+p.obs));
  if(p.calcado) info.append(el("div","nota","Calçado: "+p.calcado));
  (p.ganchos||[]).forEach((g,k)=>{ if(g) info.append(el("div","nota",`Gancho do vídeo ${k+1}: “${g}”`)); });
  if(st==="aguardando"&&assets){ const cx=el("button","leve","Cancelar pedido"); cx.onclick=async()=>{ cx.disabled=true; cx.textContent="Apagando…";
    try{ await apagarClipes(p,true); }catch(e){ cx.disabled=false; cx.textContent="Não apagou, toque de novo"; } }; bs.append(cx); }
  if(st==="aguardando") info.append(el("div","nota","Na fila. Peça ao Claude no chat: “edita o TikTok Shop”."));
  if(st==="ajuste"||st==="editando") info.append(el("div","nota",st==="ajuste"?"Ajuste pedido: "+(p.nota||""):"O Claude está montando os 5 criativos."));
  if(p.aviso) info.append(el("div","aviso","Atenção: "+p.aviso));
  v.append(info);
  if(st==="pronto"){
    const lista=el("div","criativos");
    (p.criativos||[]).forEach((c,k)=>{
      const row=el("div","criativo"+(c.postado_em?" feito":"")); const im=el("img"); im.src=blob(c.poster); im.alt=""; im.loading="lazy";
      const tx=el("div","info"); const tt=el("div","tit",c.nome||"Criativo "+(k+1)); if(c.gancho) tt.append(el("small",null,"“"+c.gancho+"”")); tx.append(tt);
      const b=el("div","botoes");
      // a dona 03/11: salvar igual às postagens da Shopee = abrir no app do Drive (⋯ > Enviar uma cópia > Salvar vídeo)
      let sv;
      if(c.drive_url){ sv=link("Salvar vídeo (Drive)",c.drive_url,false,()=>{}); }
      else{ sv=el("button","b","Enviar ao Drive");
        sv.onclick=async()=>{ sv.disabled=true; sv.textContent="Enviando…";
          try{ const url=await enviarDrive(c); const arr=(p.criativos||[]).map((x,j)=>j===k?{...x,drive_url:url}:x);
            await db.doc("tiktokshop/"+p._id).update({criativos:arr}); }
          catch(e){ sv.disabled=false; sv.textContent=e&&e.msg?e.msg:"Erro: "+String(e&&(e.code||e.message)||e).slice(0,80); sv.style.fontSize=".7rem"; } }; }
      const cp=el("button","b","Copiar legenda"); const caixa=el("div","legenda",c.legenda||""); caixa.hidden=true;
      cp.onclick=async()=>{ try{ await navigator.clipboard.writeText(c.legenda||""); cp.textContent="✓ Copiada"; cp.classList.add("ok"); }catch(e){ caixa.hidden=false; } };
      const po=el("button","b"+(c.postado_em?" ok":" postei"),c.postado_em?"✓ Postado · desfazer":"Postei"); po.style.gridColumn="1/-1";
      po.onclick=async()=>{ po.disabled=true; const arr=(p.criativos||[]).map((x,j)=>j===k?{...x,postado_em:x.postado_em?null:new Date().toISOString()}:x);
        try{ await db.doc("tiktokshop/"+p._id).update({criativos:arr}); }catch(e){ po.disabled=false; po.textContent="Não salvou, toque de novo"; } };
      b.append(sv,cp,po,caixa); tx.append(b); row.append(im,tx); lista.append(row); });
    v.append(lista);
    const ed=el("button","b editar","Pedir ajuste"); const area=el("textarea"); area.placeholder="O que mudar nos criativos"; area.hidden=true;
    ed.onclick=async()=>{ if(area.hidden){ area.hidden=false; area.focus(); ed.textContent="Enviar ajuste"; return; }
      ed.disabled=true; try{ await db.doc("tiktokshop/"+p._id).update({status:"ajuste",nota:area.value,pedido_em:new Date().toISOString()}); }catch(e){ ed.disabled=false; ed.textContent="Não salvou, toque de novo"; } };
    const b2=el("div","botoes"); b2.style.gridColumn="1/-1"; b2.append(ed);
    if(assets&&(p.clipes||[]).length){ const ap=el("button","b editar","Apagar clipes brutos"); ap.onclick=async()=>{ ap.disabled=true; ap.textContent="Apagando…";
      try{ await apagarClipes(p,false); }catch(e){ ap.disabled=false; ap.textContent="Não apagou, toque de novo"; } }; b2.append(ap); }
    b2.append(area); v.append(b2);
  }
  return v;
}
function renderTTS(l){
  if(assets){ if(!formTTS) formTTS=montaForm(); l.append(formTTS); }
  else l.append(el("div","vazio","Para enviar clipes, abra esta página no app do Claude logada como dona."));
  if(espaco) l.append(el("div","nota",espaco));
  const achaT=p=>!busca||semAc([p.produto,p.link,p.cor].join(" ")).includes(busca);
  const todos=tts.filter(achaT).sort((a,b)=>(a.criado_em||"").localeCompare(b.criado_em||""));
  const fim=p=>p.status==="pronto"&&(p.criativos||[]).length&&(p.criativos||[]).every(c=>c.postado_em);
  const grupos=[["Para postar",todos.filter(p=>p.status==="pronto"&&!fim(p))],["Em edição",todos.filter(p=>p.status!=="pronto")],["Todos postados",todos.filter(fim).reverse()]];
  grupos.forEach(([nome,g])=>{ if(!g.length) return; const sp=el("div","sep"); const tx=el("div"); tx.append(el("span",null,"TikTok Shop"),el("b",null,`${nome} · ${g.length}`)); sp.append(tx); l.append(sp); g.forEach(p=>l.append(cardTTS(p))); });
  if(!tts.length) l.append(el("div","vazio","Nenhum pedido ainda. Os criativos prontos aparecem aqui."));
}

(async()=>{

  const P=db.collection("posts"), partes={}, juntar=()=>{ const m=new Map(); Object.values(partes).flat().forEach(x=>m.set(x._id,x));
    posts=[...m.values()].map(x=>{ const o=otim[x._id]; if(!o) return x; if(x.status===o.status){ delete otim[x._id]; return x; } return {...x,...o}; }); render(); };
  const ouvir=(k,q,reserva)=>q.onSnapshot(s=>{ partes[k]=s.docs.map(d=>({...d.data(),_id:d.id})); juntar(); }, ()=>{ if(reserva) ouvir(k,reserva); else render(); });
  ouvir("ativos",P.where("status","not-in",["postado","descartado"]),P.where("status","==","pronto").limit(120));
  ouvir("postados",P.where("status","==","postado").limit(200),P.where("status","==","postado").limit(60));
  ouvir("descartados",P.where("status","==","descartado").limit(100),P.where("status","==","descartado").limit(30));
  db.collection("conferir").onSnapshot(s=>{ conferir=s.docs.map(d=>({...d.data(),_id:d.id})); render(); }, ()=>{});
  db.collection("esgotados").onSnapshot(s=>{ esgotados=s.docs.map(d=>({...d.data(),_id:d.id})); render(); }, ()=>{});
  db.collection("tiktokshop").onSnapshot(s=>{ tts=s.docs.map(d=>({...d.data(),_id:d.id})); render(); }, ()=>{});
  assets = await (window.claude?.use ? window.claude.use("assets") : null);
  downloads = await (window.claude?.use ? window.claude.use("downloads") : null);
  medirEspaco();
})();
